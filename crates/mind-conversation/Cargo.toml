[package]
name = "mind-conversation"
version.workspace = true
edition.workspace = true

[dependencies]
mind-proactive = { path = "../mind-proactive" }
mind-types = { workspace = true }
mind-inference = { workspace = true }
mind-tools = { workspace = true }
mind-recipes = { workspace = true }
mind-spec = { workspace = true }
mind-agents = { workspace = true }
mind-observability = { workspace = true }
mind-world = { path = "../mind-world" }
mind-governance = { workspace = true }
# E.EGRESS5b: person-only settings are read through mind_net::person_var.
mind-net = { workspace = true }
yantrik-ml = { workspace = true, default-features = false }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
# E.ERASE4: the desktop's redact needles -- SHA-256 of NFC text (icu_normalizer is already in the
# tree through url/idna).
sha2 = "0.10"
# E.EGRESS4d: the fetch budget per registrable domain -- url normalises (punycode, default port), psl
# knows the public suffixes.
url = "2"
psl = "2"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# E.GRANT2b: the OS card's query screen, pinned to the OS's versions (yantrik-os FIXES #667).
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
unicode-script = "=0.5.8"
# E.GRANT2c: the round-2 screen's NFKC and mark checks, pinned to the OS's version.
unicode-normalization = "=0.1.25"
# E.GRANT2c (#667 round 3): the UTS #39 skeleton, pinned to the OS's version.
unicode-security = "=0.1.2"

[dev-dependencies]
# E.GRANT2c: the copied screen's git blob hash (already in the tree, 0.10.7).
sha1 = "0.10"
mind-memory = { workspace = true, features = ["fixtures"] }
# E.ARENA1-F1: scripted MCP tools, so the desktop-calendar wiring is tested through the real engine.
mind-tools = { workspace = true, features = ["test-support"] }
sha2 = "0.10"
