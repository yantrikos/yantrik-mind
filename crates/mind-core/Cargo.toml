[package]
name = "mind-core"
version.workspace = true
edition.workspace = true

[dependencies]
mind-types = { workspace = true }
mind-memory = { workspace = true }
mind-inference = { workspace = true }
mind-conversation = { workspace = true }
mind-tools = { workspace = true }
mind-governance = { workspace = true }
mind-observability = { workspace = true }
mind-recipes = { workspace = true }
mind-agents = { workspace = true }
yantrik-ml = { workspace = true, default-features = false, features = ["claude-cli", "api-llm"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
# OsRng for the pairing-code mint (web.rs). Platform-NEUTRAL on purpose: this line previously
# lived only under [target.'cfg(windows)'.dependencies] (the wallet block), where it resolved on
# every Windows dev machine and on both reviewers' verification runs — and failed on the Linux
# box the mind actually ships to. A dependency the build needs everywhere must be declared
# everywhere.
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
# Wallet custody is deliberately confined to the trusted local operator CLI. The secret is held by
# Windows Credential Manager; it never enters Mind memory, configuration, logs, or an agent tool.
keyring = { version = "3.6.3", features = ["windows-native"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
zeroize = "1"

