[package]
name = "mind-evals"
version.workspace = true
edition.workspace = true

[dependencies]
mind-types = { workspace = true }
# The live router split is grown FROM the flight recorder (E.PK3d), so the harness reads it.
mind-observability = { workspace = true }
mind-memory = { workspace = true }
mind-inference = { workspace = true }
mind-conversation = { workspace = true }
mind-tools = { workspace = true }
mind-agents = { workspace = true }
mind-spec = { workspace = true }
mind-proactive = { path = "../mind-proactive" }
mind-world = { path = "../mind-world" }
yantrik-ml = { workspace = true, default-features = false, features = ["api-llm"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
# The E.SEC1b audit reads mind.db read-only; mind-memory already builds it.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
# Sealed-pack fixtures for the coverage-router oracle (E.PK3): real manifests, authored coverage.
mind-memory = { workspace = true, features = ["fixtures"] }
