[package]
name = "mind-net"
version.workspace = true
edition.workspace = true
description = "The one way the Mind reaches the network: through the machine's egress proxy, except loopback and NO_PROXY hosts (E.EGRESS1)."

[dependencies]
ureq = { version = "2", features = ["json"] }
# E.NET1h (N1): URLs are read exactly as ureq reads them (WHATWG), never split by hand.
url = "2"
# E.NET1e: the shared private ranges and the OS's egress signal are JSON.
serde_json = { workspace = true }

# E.EGRESS5d: open the person's settings file without following a link (O_NOFOLLOW).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
